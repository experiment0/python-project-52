{% load i18n %}

<ul class="navbar-nav me-auto mb-2 mb-lg-0">
    {% with request.resolver_match.namespace as namespace %}
        <li class="nav-item">
            <a 
                class="nav-link {% if namespace == 'users' %}active{% endif %}" 
                href="{% url 'users:index' %}"
            >
                {% translate 'Users' %}
            </a>
        </li>
        <li class="nav-item">
            <a 
                class="nav-link {% if namespace == 'statuses' %}active{% endif %}" 
                href="{% url 'statuses:index' %}"
            >
                {% translate 'Statuses' %}
            </a>
        </li>
        <li class="nav-item">
            <a 
                class="nav-link {% if namespace == 'labels' %}active{% endif %}" 
                href="{% url 'labels:index' %}"
            >
                {% translate 'Labels' %}
            </a>
        </li>
        <li class="nav-item">
            <a 
                class="nav-link {% if namespace == 'tasks' %}active{% endif %}" 
                href="{% url 'tasks:index' %}"
            >
                {% translate 'Tasks' %}
            </a>
        </li>
    {% endwith %}
</ul>

<div class="d-flex">
    <a class="btn btn-outline-dark me-md-2" href="{% url 'users:update' request.user.id %}">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-fill"
            viewBox="0 0 16 16">
            <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6" />
        </svg>
        {{ request.user.get_username }}
    </a>

    <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <input class="btn btn-outline-primary" type="submit" value="{% translate 'Logout' %}">
    </form>
</div>
